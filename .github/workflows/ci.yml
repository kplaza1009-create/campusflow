name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (format, lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CAMPUSFLOW_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app tests scripts
      - run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (format, lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CAMPUSFLOW_E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campusflow_e2e
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker image (build, then smoke test as Render runs it)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t campusflow .
      - name: Start it with production settings
        # A plain postgresql:// URL, as hosts hand out, to cover the driver rewrite.
        run: |
          docker run -d --name app --network host -e PORT=8080 \
            -e CAMPUSFLOW_ENVIRONMENT=production \
            -e CAMPUSFLOW_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
            -e CAMPUSFLOW_SESSION_COOKIE_SECURE=true -e CAMPUSFLOW_SESSION_COOKIE_NAME=__Host-cf_session \
            -e CAMPUSFLOW_ALLOWED_ORIGINS='[]' -e CAMPUSFLOW_TRUSTED_PROXY_HOPS=1 \
            campusflow
          for _ in $(seq 60); do curl -fsS localhost:8080/api/health && exit 0; sleep 2; done
          exit 1
      - name: Smoke test
        # Each response is saved before grep reads it: in a pipe, a failed curl would be
        # hidden behind grep's exit status (an error page can still carry the headers).
        run: |
          set -euxo pipefail
          page=$(curl -fsS localhost:8080/week)
          grep -q '<div id="root">' <<<"$page"
          head=$(curl -fsSI localhost:8080/)  # HEAD must answer 200, like GET
          grep -qi '^content-security-policy:' <<<"$head"
          grep -qi '^strict-transport-security:' <<<"$head"
          grep -qi '^cache-control: no-cache' <<<"$head"
          curl -fsSI localhost:8080/week >/dev/null
          demo=$(curl -fsS -X POST localhost:8080/api/auth/demo -H 'X-Forwarded-For: 198.51.100.7')
          grep -q '"is_demo":true' <<<"$demo"
          docs=$(curl -fsS localhost:8080/docs)
          grep -q '<div id="root">' <<<"$docs"  # the app, not Swagger
      - if: always()
        run: docker logs app
