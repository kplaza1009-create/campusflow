[project]
name = "campusflow-api"
version = "0.1.0"
description = "CampusFlow API: accounts, courses, assignments"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "email-validator>=2.2",
    "fastapi>=0.159",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_decorators = false

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
